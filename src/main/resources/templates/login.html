<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Patitas Felices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/estilos/sytless.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/logo.ico}">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <nav th:replace="~{fragments/header :: nav('login')}"></nav>

    <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="card shadow-lg border-0 rounded-4 w-100" style="max-width: 900px; overflow: hidden;">
            <div class="row g-0">

                <div class="col-md-6 d-none d-md-block">
                    <img th:src="@{/Img/happydog.jpg}"
                        alt="Perrito feliz" class="img-fluid"
                        style="object-fit: cover; height: 100%; min-height: 500px;">
                </div>

                <div class="col-md-6 p-5 d-flex flex-column justify-content-center bg-white">
                    <div class="text-center mb-4">
                        <img th:src="@{/logo.ico}" alt="Logo" width="60" class="mb-3 rounded-circle">
                        <h2 class="fw-bold">¡Hola de nuevo!</h2>
                        <p class="text-muted">Ingresa para encontrar a tu nuevo mejor amigo</p>
                    </div>

                    <form th:action="@{/procesar-login}" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Correo electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control border-start-0"
                                    placeholder="ejemplo@correo.com" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control border-start-0"
                                    placeholder="••••••••" required>
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg custom-btn">Ingresar</button>
                        </div>
                        <div class="text-center mt-4">
                            <a href="#" class="text-decoration-none text-muted">¿Olvidaste tu contraseña?</a>
                            <hr>
                            <p class="mb-0">¿No tienes cuenta? <a href="#"
                                    class="text-decoration-none fw-bold">Regístrate aquí</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/Js/script.js}"></script>
</body>

</html>
